<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{subtitle}}">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/base.css">
</head>
<body>
  <header class="site-head">
    <button class="theme-toggle" id="theme-toggle" type="button" hidden></button>
    <p class="eyebrow">{{eyebrow}}</p>
    <h1 class="site-title">{{title}}</h1>
    <p class="site-sub">{{subtitle}}</p>
    <p class="site-intro">{{intro}}</p>
    <hr class="rule">
  </header>

  <main>
    <ol class="calendar">
{{tiles}}
    </ol>
    <p class="progress" id="progress"></p>
    <noscript>
      <p class="locked-note">Per aprire le caselle serve JavaScript: il contenuto è cifrato e viene decifrato nel browser.</p>
    </noscript>
  </main>

  <footer class="site-foot">{{footer}}</footer>

  <script type="application/json" id="avvento-config">{{configJson}}</script>
  <script type="module">
    window.AVVENTO = JSON.parse(document.getElementById('avvento-config').textContent);
  </script>
  <script type="module" src="assets/js/home.js"></script>
</body>
</html>
